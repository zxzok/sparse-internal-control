name: Recalculate paper results

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saved-record-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install replay and test dependencies
        run: |
          python -m pip install -r requirements/replay.lock.txt
          python -m pip install --no-deps -e .
      - name: Check distributed file manifest
        run: python -m sparse_control check-release --manifest
      - name: Recalculate tables and statistics
        run: python -m sparse_control reproduce --output ../paper-replay
      - name: Verify numerical outputs
        run: python -m sparse_control verify --output ../paper-replay
      - name: Run tests
        run: python -m pytest -q
