[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-internal-control"
version = "1.2.1"
description = "Sparse Internal Control of Language Models: methods and experimental records"
requires-python = ">=3.12"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "PATENTS.md"]
authors = [{name = "Xizhe Zhang"}]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sparse-control = "sparse_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires the explicit model execution environment", "smoke: bounded pretrained-model execution"]
